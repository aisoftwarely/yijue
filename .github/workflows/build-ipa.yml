name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Generate app icon
        run: swift tools/make_icon.swift Yijue/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Info.plist
        run: |
          plutil -p Support/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" Support/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSMotionUsageDescription" Support/Info.plist

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Yijue.xcodeproj \
            -scheme Yijue \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            build

      - name: Verify App Intents metadata
        run: |
          APP=build/Build/Products/Release-iphoneos/Yijue.app
          ls -la "$APP"
          if [ -d "$APP/Metadata.appintents" ]; then
            echo "App Intents metadata: OK"
          else
            echo "::warning::Metadata.appintents not found; verify App Intents extraction in Xcode 27"
          fi

      - name: Package IPA
        run: |
          rm -rf Payload Yijue.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Yijue.app Payload/
          zip -qry Yijue.ipa Payload
          ls -lh Yijue.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yijue-ipa
          path: Yijue.ipa

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: Yijue.ipa
          generate_release_notes: false
