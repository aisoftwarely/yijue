name: Yijue

options:
  bundleIdPrefix: com.aisoftwarely
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Yijue:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Yijue
    info:
      path: Support/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: 睡个好觉
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.aisoftwarely.yijue
            CFBundleURLSchemes:
              - yijue
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: 用于在你忘记记录时，根据手机夜间的静止状态推测睡眠时间。数据只保存在本机。
        NSAlarmKitUsageDescription: 用于在设定的起床时间响铃。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aisoftwarely.yijue
        PRODUCT_NAME: Yijue
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  Yijue:
    build:
      targets:
        Yijue: all
    run:
      config: Debug
    archive:
      config: Release
